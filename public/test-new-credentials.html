<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test New Credentials</title>
</head>
<body>
    <h1>Test New Admin Credentials</h1>
    <button onclick="testNewAuth()">Test New Credentials (devteam@flomadlabs.com)</button>
    <pre id="result"></pre>

    <script>
        async function testNewAuth() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing new credentials...';
            
            try {
                const response = await fetch('/api/debug/auth-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'devteam@flomadlabs.com',
                        password: 'FlomadLabs2025'
                    })
                });
                
                const data = await response.json();
                resultEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
